name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Required checks
    uses: ./.github/workflows/ci.yml

  package:
    name: Package universal app
    needs: checks
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and create archive
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir -p build/ci
          ./Scripts/package.sh "$RELEASE_TAG" 2>&1 | tee build/ci/package.log
      - name: Upload release package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            dist/Otolog-*-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload package log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-log
          path: build/ci/package.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish development prerelease
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          開発用のUniversal Binary（macOS 15以降，Apple Silicon／Intel）です．

          このアプリはad-hoc署名で，Developer ID署名・Appleの公証はありません．配布用の信頼済み署名を持つアプリではないため，macOSの保護機能によって起動できない場合があります．ソースからのローカルビルドも利用できます．

          実会議での録音品質，AirPodsとの同時利用，長時間の実機安定性は未検証です．CIは合成入力を使った自動検証です．

          ZIPを展開するとOtolog.appが入っています．整合性の確認にはSHA256SUMS.txtを使ってください．
          NOTES
          gh release create "$RELEASE_TAG" Otolog-*-universal.zip SHA256SUMS.txt \
            --verify-tag --title "Otolog ${RELEASE_TAG#v}" \
            --prerelease --latest=false --notes-file release-notes.md
